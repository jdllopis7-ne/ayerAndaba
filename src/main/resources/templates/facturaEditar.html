<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Factura</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
    <div class="starter-template"><h1>Inmobiliaria</h1><h2 th:text="${formBean.id} ? 'Editar Factura' : 'Registrar Factura'"></h2></div>
    <form th:action="@{/facturaEditar}" th:object="${formBean}" method="post">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="error"></p>
        <input type="hidden" th:field="*{id}" />
        <table border="0" style="align-self: center;">
            <tr th:if="${formBean.id != null}"><td>ID</td><td th:text="${formBean.id}"></td></tr>
            <tr><td>Contrato</td><td><select th:field="*{idContrato}" th:disabled="${formBean.id != null}"><option value="">Seleccione</option><option th:each="c : ${allContratos}" th:value="${c.id}" th:text="${'#' + c.id + ' - ' + c.propiedad.direccion + ' - ' + c.inquilino.apellido + ' (' + c.estado.descripcion + ')'}"></option></select><input th:if="${formBean.id != null}" type="hidden" th:field="*{idContrato}" /></td><td><p th:if="${#fields.hasErrors('idContrato')}" th:errors="*{idContrato}" class="error"></p></td></tr>
            <tr><td>Concepto</td><td><input type="text" th:field="*{conceptoFacturado}" /></td><td><p th:if="${#fields.hasErrors('conceptoFacturado')}" th:errors="*{conceptoFacturado}" class="error"></p></td></tr>
            <tr><td>Fecha emision</td><td><input type="date" th:field="*{fechaEmision}" /></td><td><p th:if="${#fields.hasErrors('fechaEmision')}" th:errors="*{fechaEmision}" class="error"></p></td></tr>
            <tr><td>Fecha vencimiento</td><td><input type="date" th:field="*{fechaVencimiento}" /></td><td><p th:if="${#fields.hasErrors('fechaVencimiento')}" th:errors="*{fechaVencimiento}" class="error"></p></td></tr>
            <tr><td>Importe</td><td><input type="number" step="0.01" min="0.01" th:field="*{importe}" /></td><td><p th:if="${#fields.hasErrors('importe')}" th:errors="*{importe}" class="error"></p></td></tr>
            <tr><td>Estado</td><td><select th:field="*{estado}"><option th:each="e : ${allEstados}" th:value="${e}" th:text="${e.descripcion}"></option></select></td><td><p th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}" class="error"></p></td></tr>
            <tr><td>Fecha pago</td><td><input type="date" th:field="*{fechaPago}" /></td><td><p th:if="${#fields.hasErrors('fechaPago')}" th:errors="*{fechaPago}" class="error"></p></td></tr>
            <tr><td>Medio pago</td><td><select th:field="*{medioPago}"><option value="">Sin pago</option><option th:each="m : ${allMediosPago}" th:value="${m}" th:text="${m.descripcion}"></option></select></td><td><p th:if="${#fields.hasErrors('medioPago')}" th:errors="*{medioPago}" class="error"></p></td></tr>
            <tr><td>Importe pagado</td><td><input type="number" step="0.01" min="0.01" th:field="*{importePagado}" /></td><td><p th:if="${#fields.hasErrors('importePagado')}" th:errors="*{importePagado}" class="error"></p></td></tr>
            <tr><td>Interes pagado</td><td><input type="number" step="0.01" min="0" th:field="*{interesPagado}" /></td><td><p th:if="${#fields.hasErrors('interesPagado')}" th:errors="*{interesPagado}" class="error"></p></td></tr>
        </table>
        <table class="botones"><tr><td><button type="submit" name="action" value="actionAceptar">Aceptar</button></td><td><button type="submit" name="action" value="actionCancelar">Cancelar</button></td></tr></table>
    </form>
</body>
</html>
