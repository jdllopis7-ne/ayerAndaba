<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Propiedades</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
    <div class="starter-template">
        <h1>Inmobiliaria</h1>
        <h2>Buscar Propiedades</h2>
    </div>
    <form th:action="@{/propiedadesBuscar}" th:object="${formBean}" method="post">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="error"></p>
        <table border="1" style="align-self: center;">
            <tr><td>Direccion</td><td><input type="text" th:field="*{direccion}" /></td></tr>
            <tr><td>Ciudad</td><td><select th:field="*{ciudadSeleccionada}"><option value="">Todas</option><option th:each="c : ${allCiudades}" th:value="${c.id}" th:text="${c.nombre}"></option></select></td></tr>
            <tr><td>Tipo</td><td><select th:field="*{tipo}"><option value="">Todos</option><option th:each="t : ${allTipos}" th:value="${t}" th:text="${t.descripcion}"></option></select></td></tr>
            <tr><td>Estado</td><td><select th:field="*{estado}"><option value="">Todos</option><option th:each="e : ${allEstados}" th:value="${e}" th:text="${e.descripcion}"></option></select></td></tr>
        </table>
        <table class="botones"><tr>
            <td><button type="submit" name="action" value="actionBuscar">Buscar</button></td>
            <td><button type="submit" name="action" value="actionCancelar">Cancelar</button></td>
            <td><button type="submit" name="action" value="actionRegistrar">Registrar</button></td>
        </tr></table>
        <table class="resultados" border="0" style="align-self: center;">
            <thead><tr>
                <th>ID</th><th>Direccion</th><th>Ciudad</th><th>Tipo</th><th>Ambientes</th><th>Metros</th><th>Estado</th><th>Propietario</th><th></th><th></th>
            </tr></thead>
            <tbody>
                <tr th:each="p : ${resultados}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.direccion}"></td>
                    <td th:text="${p.ciudad.nombre}"></td>
                    <td th:text="${p.tipo.descripcion}"></td>
                    <td th:text="${p.cantidadAmbientes}"></td>
                    <td th:text="${p.metrosCuadrados}"></td>
                    <td th:text="${p.estado.descripcion}"></td>
                    <td th:text="${p.propietario.apellido + ', ' + p.propietario.nombre}"></td>
                    <td><a th:href="@{/propiedadEditar/{id}(id=${p.id})}">editar</a></td>
                    <td><button type="submit" th:formaction="@{/propiedadesBuscar/delete(id=${p.id})}" formmethod="post" onclick="return confirm('Seguro que deseas eliminar esta propiedad?');">eliminar</button></td>
                </tr>
            </tbody>
        </table>
    </form>
</body>
</html>
