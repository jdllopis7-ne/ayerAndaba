<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Contratos</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
    <div class="starter-template"><h1>Inmobiliaria</h1><h2>Buscar Contratos</h2></div>
    <form th:action="@{/contratosBuscar}" th:object="${formBean}" method="post">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="error"></p>
        <table border="1" style="align-self: center;">
            <tr><td>Propiedad</td><td><select th:field="*{propiedadSeleccionada}"><option value="">Todas</option><option th:each="p : ${allPropiedades}" th:value="${p.id}" th:text="${p.direccion + ' - ' + p.ciudad.nombre}"></option></select></td></tr>
            <tr><td>Inquilino</td><td><select th:field="*{inquilinoSeleccionado}"><option value="">Todos</option><option th:each="p : ${allPersonas}" th:value="${p.id}" th:text="${p.apellido + ', ' + p.nombre}"></option></select></td></tr>
            <tr><td>Estado</td><td><select th:field="*{estado}"><option value="">Todos</option><option th:each="e : ${allEstados}" th:value="${e}" th:text="${e.descripcion}"></option></select></td></tr>
            <tr><td>Fecha inicio</td><td><input type="date" th:field="*{fechaInicio}" /></td></tr>
        </table>
        <table class="botones"><tr><td><button type="submit" name="action" value="actionBuscar">Buscar</button></td><td><button type="submit" name="action" value="actionCancelar">Cancelar</button></td><td><button type="submit" name="action" value="actionRegistrar">Registrar</button></td></tr></table>
        <table class="resultados" border="0" style="align-self: center;">
            <thead><tr><th>ID</th><th>Propiedad</th><th>Propietario</th><th>Inquilino</th><th>Fecha inicio</th><th>Importe</th><th>Vencimiento</th><th>Estado</th><th></th><th></th></tr></thead>
            <tbody><tr th:each="c : ${resultados}">
                <td th:text="${c.id}"></td><td th:text="${c.propiedad.direccion}"></td><td th:text="${c.propiedad.propietario.apellido + ', ' + c.propiedad.propietario.nombre}"></td><td th:text="${c.inquilino.apellido + ', ' + c.inquilino.nombre}"></td><td th:text="${c.fechaInicio}"></td><td th:text="${c.importeMensual}"></td><td th:text="${c.diaVencimientoMensual}"></td><td th:text="${c.estado.descripcion}"></td>
                <td><a th:href="@{/contratoEditar/{id}(id=${c.id})}">editar</a></td>
                <td><button type="submit" th:formaction="@{/contratosBuscar/delete(id=${c.id})}" formmethod="post" onclick="return confirm('Seguro que deseas eliminar este contrato?');">eliminar</button></td>
            </tr></tbody>
        </table>
    </form>
</body>
</html>
