<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Buscar Publicaciones</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
    <div class="starter-template"><h1>Inmobiliaria</h1><h2>Buscar Publicaciones</h2></div>
    <form th:action="@{/publicacionesBuscar}" th:object="${formBean}" method="post">
        <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" class="error"></p>
        <table border="1" style="align-self: center;">
            <tr><td>Propiedad</td><td><select th:field="*{propiedadSeleccionada}"><option value="">Todas</option><option th:each="p : ${allPropiedades}" th:value="${p.id}" th:text="${p.direccion + ' - ' + p.ciudad.nombre}"></option></select></td></tr>
            <tr><td>Ciudad</td><td><select th:field="*{ciudadSeleccionada}"><option value="">Todas</option><option th:each="c : ${allCiudades}" th:value="${c.id}" th:text="${c.nombre}"></option></select></td></tr>
            <tr><td>Estado</td><td><select th:field="*{estado}"><option value="">Todos</option><option th:each="e : ${allEstados}" th:value="${e}" th:text="${e.descripcion}"></option></select></td></tr>
            <tr><td>Precio desde</td><td><input type="number" step="0.01" th:field="*{precioDesde}" /></td></tr>
            <tr><td>Precio hasta</td><td><input type="number" step="0.01" th:field="*{precioHasta}" /></td></tr>
        </table>
        <table class="botones"><tr><td><button type="submit" name="action" value="actionBuscar">Buscar</button></td><td><button type="submit" name="action" value="actionCancelar">Cancelar</button></td><td><button type="submit" name="action" value="actionRegistrar">Registrar</button></td></tr></table>
        <table class="resultados" border="0" style="align-self: center;">
            <thead><tr><th>ID</th><th>Direccion</th><th>Ciudad</th><th>Precio</th><th>Fecha</th><th>Estado</th><th></th><th></th></tr></thead>
            <tbody><tr th:each="p : ${resultados}">
                <td th:text="${p.id}"></td><td th:text="${p.propiedad.direccion}"></td><td th:text="${p.propiedad.ciudad.nombre}"></td><td th:text="${p.precioMensual}"></td><td th:text="${p.fechaPublicacion}"></td><td th:text="${p.estado.descripcion}"></td>
                <td><a th:href="@{/publicacionEditar/{id}(id=${p.id})}">editar</a></td>
                <td><button type="submit" th:formaction="@{/publicacionesBuscar/delete(id=${p.id})}" formmethod="post" onclick="return confirm('Seguro que deseas eliminar esta publicacion?');">eliminar</button></td>
            </tr></tbody>
        </table>
    </form>
</body>
</html>
